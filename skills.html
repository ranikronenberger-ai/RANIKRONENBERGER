<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rani Kronenberger — Skills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #111;
      font-family: 'Cormorant Garant', Georgia, serif;
      padding: 4rem;
      max-width: 680px;
    }

    .back {
      font-size: 0.85rem;
      color: #aaa;
      text-decoration: none;
      border-bottom: 1px solid #f2a0aa;
      display: inline-block;
      margin-bottom: 3rem;
    }

    .back:hover { color: #f2a0aa; }

    h1 {
      font-size: 1.4rem;
      font-weight: normal;
      margin-bottom: 3rem;
    }

    .section {
      margin-bottom: 3rem;
    }

    .section h2 {
      font-size: 0.7rem;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #aaa;
      margin-bottom: 1rem;
    }

    .section p {
      font-size: 1rem;
      line-height: 1.8;
      color: #444;
    }

    .lang-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .lang-list li {
      font-size: 1rem;
      color: #444;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #f5f5f5;
      padding-bottom: 0.5rem;
    }

    .lang-list li:last-child {
      border-bottom: none;
    }

    .lang-level {
      font-size: 0.75rem;
      color: #bbb;
      font-style: italic;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>
  <h1>skillset</h1>

  <div class="section">
    <h2>languages</h2>
    <ul class="lang-list">
      <li>Flemish <span class="lang-level">native (C2)</span></li>
      <li>English <span class="lang-level">fluent (B2)</span></li>
      <li>French <span class="lang-level">intermediate (B1)</span></li>
      <li>German <span class="lang-level">beginner (A1)</span></li>
      <li>Sarcasm <span class="lang-level">native</span></li>
    </ul>
  </div>

</body>
</html>
