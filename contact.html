<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rani kronenberger — contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scrollbar-gutter: stable; }

    body {
      background: #f8f5ef;
      color: #111;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4rem;
    }

    .nav-name {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-decoration: none;
      color: #111;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #111;
      text-decoration: none;
    }

    .nav-links a:hover { opacity: 0.4; }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3.5rem, 7vw, 7rem);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 3.5rem;
    }

    h1 em { font-style: italic; }

    .page-subtitle {
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #aaa;
      margin-top: 0.75rem;
      margin-bottom: 2rem;
    }

    .contact-body {
      display: flex;
      align-items: flex-start;
      gap: 6rem;
    }

    .contact-left { flex: 1; max-width: 480px; }

    .contact-body .hanging-phone { align-self: stretch; display: flex; align-items: flex-start; padding-top: 1rem; }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.4rem 0;
      border-bottom: 1px solid #f2c4cf;
      text-decoration: none;
      color: #111;
    }

    .contact-item:first-child { border-top: 1px solid #f2c4cf; }

    .contact-item:hover { opacity: 0.5; }

    .contact-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: #c0909a;
    }

    .contact-label {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .contact-value {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-left: auto;
      color: #111;
    }

    /* ── TEARAWAY ── */
    .tearaway {
      flex-shrink: 0;
      width: 320px;
      background: #fdf6f8;
      border-radius: 8px;
      padding: 2rem 2rem 0;
      box-shadow: 0 4px 20px rgba(180,130,150,0.1);
      border: 1px solid rgba(242,196,207,0.5);
      position: relative;
    }

    .tearaway-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.4rem;
      font-weight: 400;
      line-height: 1.1;
      color: #111;
      margin-bottom: 1.8rem;
    }

    .tearaway-title em {
      font-style: italic;
      color: #c0909a;
    }

    .tearaway-tape {
      width: 60px;
      height: 18px;
      background: rgba(200,180,190,0.35);
      border-radius: 2px;
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%) rotate(-1deg);
    }

    .strips {
      display: flex;
      border-top: 1px dashed #f2c4cf;
    }

    .strip {
      flex: 1;
      padding: 0.6rem 0.4rem 1rem;
      border-right: 1px dashed #f2c4cf;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
    }

    .strip:last-child { border-right: none; }

    .strip span {
      font-size: 0.62rem;
      font-weight: 300;
      color: #888;
      letter-spacing: 0.04em;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    .strip:hover span { color: #c0909a; }

    .strip.torn {
      cursor: default;
      height: 38px;
      flex: 1;
      align-items: flex-start;
      padding: 0;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    /* white paper stub with realistic torn bottom edge */
    .strip.torn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: #fdf6f8;
      clip-path: polygon(
        0% 0%, 100% 0%,
        100% 62%,
        95% 72%, 91% 58%, 87% 70%, 83% 55%,
        79% 68%, 75% 52%, 70% 65%, 66% 50%,
        62% 63%, 58% 48%, 54% 61%, 49% 50%,
        45% 64%, 41% 52%, 37% 66%, 33% 54%,
        29% 67%, 24% 53%, 20% 65%, 16% 52%,
        12% 64%, 8% 54%, 4% 68%, 0% 58%
      );
    }

    .strip.torn:hover span { color: #888; }

    .page-card {
      width: 100%;
      min-height: 100vh;
      padding: 2rem 3rem 3rem;
      position: relative;
    }

    /* ── HANGING PHONE (background decoration) ── */
    .hanging-phone {
      position: absolute;
      top: 0;
      left: 46%;
      width: clamp(120px, 14vw, 190px);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 0;
    }

    nav, h1, p, .contact-body { position: relative; z-index: 1; }

    @media (max-width: 960px) {
      .page-card { padding: 2rem; }
      .contact-body { gap: 3rem; flex-wrap: wrap; }
      .tearaway { width: 100%; max-width: 380px; }
      .hanging-phone { display: none; }
    }

    @media (max-width: 600px) {
      .page-card { padding: 1.5rem; }
      .contact-body { flex-direction: column; gap: 2rem; }
      .tearaway { width: 100%; }
    }

  </style>
</head>
<body>
<div class="page-card">
  <img class="hanging-phone" src="phone.png" alt="">

  <nav>
    <a class="nav-name" href="index.html">rani kronenberger</a>
    <div class="nav-links">
      <a href="projects.html">projects</a>
      <a href="publications.html">publications</a>
      <a href="values.html">values</a>
      <a href="contact.html" style="color:#6b1a2a;">contact</a>
    </div>
  </nav>

  <h1><em>Say</em><br>hello.</h1>

  <div class="contact-body">

</div><!-- end page-card -->
</body>
</html>
